name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: model_portfolio
          POSTGRES_PASSWORD: model_portfolio
          POSTGRES_DB: model_portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U model_portfolio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://model_portfolio:model_portfolio@localhost:5432/model_portfolio?schema=public
      JWT_SECRET: ci-test-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=apps/backend

      - name: Apply database migrations
        run: npm run prisma:deploy --workspace=apps/backend

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
